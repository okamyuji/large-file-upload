name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '18'

jobs:
  # Go サーバーのテストとビルド
  test-go-server:
    name: Test Go Server
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./server
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Install dependencies
      run: go mod download
    
    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...
    
    - name: Generate coverage report
      run: go tool cover -html=coverage.out -o coverage.html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./server/coverage.out
        flags: server
        name: server-coverage
    
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        working-directory: ./server
    
    - name: Build binary
      run: go build -v -o server main.go
    
    - name: Upload server binary
      uses: actions/upload-artifact@v4
      with:
        name: server-binary
        path: ./server/server

  # iOS アプリのテストとビルド
  test-ios-app:
    name: Test iOS App
    runs-on: macos-latest
    
    defaults:
      run:
        working-directory: ./client
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Select Xcode version
      run: |
        # ランナーで利用可能な最新の Xcode を選ぶ (macos-latest の default 版)
        sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)/Contents/Developer" || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
    
    - name: Cache Xcode DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-xcode-derived-data-${{ hashFiles('**/*.xcodeproj/**') }}
        restore-keys: |
          ${{ runner.os }}-xcode-derived-data-
    
    - name: Build and Test
      run: |
        # ランナー上で利用可能な最新の iPhone シミュレータを動的に選ぶ
        DEST=$(xcrun simctl list devices available | awk '/^-- iOS/{iOS=$0; next} /iPhone/ && iOS!="" {print iOS, $0}' | tail -1)
        SIM=$(echo "$DEST" | sed -n 's/.*\(iPhone [^(]*\) (.*/\1/p' | sed 's/ *$//')
        OS=$(echo "$DEST" | sed -n 's/^-- iOS \([0-9.]*\).*/\1/p')
        if [ -z "$SIM" ] || [ -z "$OS" ]; then
          echo "iPhone シミュレータが見つかりません"; exit 1
        fi
        echo "使用シミュレータ: $SIM / iOS $OS"
        xcodebuild \
          -project LargeFileUpload.xcodeproj \
          -scheme LargeFileUpload \
          -destination "platform=iOS Simulator,name=$SIM,OS=$OS" \
          -derivedDataPath DerivedData \
          clean test
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ios-test-results
        path: ./client/DerivedData/Logs/Test
    
    - name: Archive App
      if: github.ref == 'refs/heads/main'
      run: |
        xcodebuild \
          -project LargeFileUpload.xcodeproj \
          -scheme LargeFileUpload \
          -configuration Release \
          -archivePath LargeFileUpload.xcarchive \
          archive
    
    - name: Upload Archive
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: ios-archive
        path: ./client/LargeFileUpload.xcarchive

  # OpenAPI仕様の検証
  validate-api:
    name: Validate OpenAPI Specification
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install OpenAPI tools
      run: |
        npm install -g @redocly/cli

    - name: Validate OpenAPI spec
      run: |
        redocly lint docs/openapi.yaml
    
    - name: Generate API documentation
      run: |
        npx redoc-cli build docs/openapi.yaml --output docs/api-documentation.html
    
    - name: Upload API documentation
      uses: actions/upload-artifact@v4
      with:
        name: api-documentation
        path: docs/api-documentation.html

  # セキュリティスキャン
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('trivy-results.sarif') != ''
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Gosec Security Scanner (Go)
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        # gosec が全パスをスキャンしても失敗しないように || true、
        # 出力ファイルが無いままアップロードステップに行かないよう空 SARIF を用意
        gosec -fmt sarif -out gosec-results.sarif ./server/... || true
        if [ ! -f gosec-results.sarif ]; then
          echo '{"version":"2.1.0","runs":[]}' > gosec-results.sarif
        fi
      continue-on-error: true

    - name: Upload Gosec scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('gosec-results.sarif') != ''
      continue-on-error: true
      with:
        sarif_file: 'gosec-results.sarif'

  # Docker イメージのビルドとプッシュ
  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [test-go-server, validate-api, security-scan]
    # DOCKER_USERNAME / DOCKER_PASSWORD secret が設定されていない環境では
    # Docker Hub への push はスキップする。
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DOCKER_PUBLISH == 'true'
    
    defaults:
      run:
        working-directory: ./server
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/large-file-upload-server
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./server
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # デプロイメント（本番環境）
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-go-server, test-ios-app, build-docker]
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PROD_DEPLOY == 'true'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to production server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USERNAME }}
        key: ${{ secrets.PROD_SSH_KEY }}
        script: |
          cd /opt/large-file-upload
          docker-compose pull
          docker-compose up -d
          docker system prune -f
    
    - name: Health check
      run: |
        sleep 30
        curl -f ${{ secrets.PROD_URL }}/health || exit 1
    
    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # パフォーマンステスト
  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PROD_DEPLOY == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup K6
      run: |
        sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6
    
    - name: Run performance tests
      run: |
        k6 run tests/performance/upload-test.js
      env:
        TARGET_URL: ${{ secrets.PROD_URL }}
    
    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results
        path: tests/performance/results/

  # 通知
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test-go-server, test-ios-app, validate-api, security-scan]
    if: always()
    
    steps:
    - name: Notify success
      if: ${{ needs.test-go-server.result == 'success' && needs.test-ios-app.result == 'success' && env.SLACK_WEBHOOK != '' }}
      uses: 8398a7/action-slack@v3
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      with:
        status: success
        text: 'All tests passed! ✅'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

    - name: Notify failure
      if: ${{ contains(needs.*.result, 'failure') && env.SLACK_WEBHOOK != '' }}
      uses: 8398a7/action-slack@v3
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      with:
        status: failure
        text: 'Some tests failed! ❌'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  security:
    permissions:
      contents: read
      pull-requests: write
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
