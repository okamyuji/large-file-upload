name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '18'

permissions:
  contents: read

jobs:
  # Go サーバーのテスト・lint・ビルド
  test-go-server:
    name: Test Go Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ./server/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run tests with race detector
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"
          # Test カバレッジが極端に低い場合のみ失敗させる（品質下限）
          if (( $(echo "$COVERAGE < 30" | bc -l) )); then
            echo "Coverage ${COVERAGE}% below 30% floor"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ./server

      - name: Build binary
        run: go build -v -o server main.go

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: ./server/server

  # iOS アプリのビルド検証 (テストはスタブのみのため build のみ、archive は非現実的なので削除)
  test-ios-app:
    name: Test iOS App
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          # ランナーで利用可能な最新の Xcode を選ぶ
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)/Contents/Developer" \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-derived-data-${{ hashFiles('**/*.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-derived-data-

      - name: Build for iOS Simulator
        # 現状のテスト (LargeFileUploadTests は空の @Test example()、UI テストは launch のみ) では
        # シミュレータ起動 + 実機テストを走らせる価値がないためコンパイル通過だけ検証する。
        # 実質的なユニット/UI テストが増えたら xcodebuild test に切り替えること。
        run: |
          xcodebuild \
            -project LargeFileUpload.xcodeproj \
            -scheme LargeFileUpload \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build

  # OpenAPI 仕様の lint
  validate-api:
    name: Validate OpenAPI Specification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Lint OpenAPI spec
        run: redocly lint docs/openapi.yaml

  # セキュリティスキャン (Trivy + Gosec)
  # code-scanning が有効化されていない環境では SARIF アップロードを続行しても失敗にしない
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ./server/go.sum

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Gosec Security Scanner (Go)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./server/... || true
          if [ ! -f gosec-results.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > gosec-results.sarif
          fi

      - name: Upload Gosec scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('gosec-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'gosec-results.sarif'

  security:
    permissions:
      contents: read
      pull-requests: write
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
